schema:
  - schema.graphqls

exec:
  filename: generated.go
  package: main

model:
  filename: graph/model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: .
  package: main

models:
  Time:
    model:
      - github.com/99designs/gqlgen/graphql.Time
  BusinessYear:
    model:
      - bureaucracy/backend.BusinessYear
  BusinessYearPage:
    model:
      - bureaucracy/backend.BusinessYearPage
  Invoice:
    model:
      - bureaucracy/backend.Invoice
  InvoicePage:
    model:
      - bureaucracy/backend.InvoicePage
