schema:
  - schema.graphqls

exec:
  filename: generated.go
  package: main

model:
  filename: graph/model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: .
  package: main

models:
  Time:
    model:
      - github.com/99designs/gqlgen/graphql.Time
  BusinessYear:
    model:
      - bureaucracy/backend.BusinessYear
  BusinessYearPage:
    model:
      - bureaucracy/backend.BusinessYearPage
  BankStatementEntry:
    model:
      - bureaucracy/backend.BankStatementEntry
  BankStatementPage:
    model:
      - bureaucracy/backend.BankStatementPage
  Customer:
    model:
      - bureaucracy/backend.Customer
  CustomerPage:
    model:
      - bureaucracy/backend.CustomerPage
  Country:
    model:
      - bureaucracy/backend.Country
  Invoice:
    model:
      - bureaucracy/backend.Invoice
  InvoicePage:
    model:
      - bureaucracy/backend.InvoicePage
  InvoiceTextTemplate:
    model:
      - bureaucracy/backend.InvoiceTextTemplate
  InvoiceItem:
    model:
      - bureaucracy/backend.InvoiceItem
  Product:
    model:
      - bureaucracy/backend.Product
  ProductPage:
    model:
      - bureaucracy/backend.ProductPage
  TaxCode:
    model:
      - bureaucracy/backend.TaxCode
